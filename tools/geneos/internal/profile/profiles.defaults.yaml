#
# Default profiles for Geneos components
#
# This file defines the default profiles used by the `geneos` command
# for initializing and deploying various Geneos components. Profiles
# provide a convenient way to pre-configure common deployment scenarios
# and can be extended or overridden as needed.
#
version: {{version}}

profiles:
  all:
    _short: "All components profile"
    _description: |
      The `all` profile is a base profile that includes all components
      with default settings. It serves as a template for other profiles
      and can be used to quickly set up a complete Geneos environment.
    gateway:
      - name: ${hostname}
    licd:
      - name: perm
        params:
          - port=7041
        imports:
          - geneos.lic=${option:licence}
    netprobe:
      - name: ${option:minimal?"minimal:":""}localhost
    webserver:
      - name: ${hostname}

  demo:
    _short: "Demo environment profile"
    _description: |
      The `geneos init demo` profile is used to initialise a Geneos Demo
      environment.

      Without any other arguments the init command initialises a
      directory called `geneos` under your user's home directory (unless
      the user's home directory ends in `geneos` in which case it uses
      that directly), downloads the latest release archives and creates
      a Gateway instance using the name `Demo Gateway` (with embedded
      space) as required for Demo licensing, a Netprobe and a
      Webserver.

      If given the `--minimal`/`-M` flag then the minimal Netprobe
      component is deployed, which can save 300MB+ of download when
      being run, for example, to build a docker container.

      If the release archive files required have already been downloaded
      then use the `--archive`/`-A` flag to indicate their location. For
      each component type this directory is checked for the latest
      release.

      To fetch the releases from the ITRS download server,
      authentication will be required. Use the `--username`/`-u` flag to
      specify the user account and you will be prompted for a password.

      The initial configuration file for the Gateway is built from the
      default templates, which are installed at the same time, and
      located in `gateway/templates` but this can be overridden with the
      `-s` option. For the Gateway component you can add include files
      using `-i PRIORITY:PATH` flag. This can be repeated multiple
      times.

      Other flags inherited from the `geneos init` command can be used
      to control the installation.

      If you are running on a Linux system that is capable of supporting
      the X Window System (which is anything with a desktop display,
      including WSL2) and you have an environment variable `DISPLAY`
      set, then the command will also install an Active Console for
      Linux. This is not started by default. This does not currently
      work from a docker container.

      ## Example Usage

      You can set-up a Demo environment like this:

      ```bash
      geneos init demo -u email@example.com
      ```

      or, to script this, do:

      ```bash
      export ITRS_DOWNLOAD_USERNAME=email@example.com
      export ITRS_DOWNLOAD_PASSWORD=mysecret
      geneos init demo
      ```

      Here you should replace the email address with the one you
      registered on the ITRS Resources website and the command will
      prompt you for your password if not supplied. The
      ITRS_DOWNLOAD_PASSWORD environment variable can also use
      "expandable format" which is the output of the `geneos aes
      password` command.
    gateway:
      name: Demo Gateway
      params:
        - options=-demo
        - port=7039
      includes:
        1000: >
          ITRS Geneos Best Practice |
          Level 1 - Infrastructure |
          ../../includes/itrs.level1.infrastructure.xml
        500: >
          ITRS Geneos Best Practice |
          Configuration |
          ../../includes/config/config.level1.infrastructure.xml
        1010: >
          ITRS Geneos Best Practice |
          Level 2 - Basic Application |
          ../../includes/itrs.level2.basic-application.xml
        510: >
          ITRS Geneos Best Practice |
          Configuration |
          ../../includes/config/config.level2.basic-application.xml
    netprobe:
      - name: ${option:minimal?"minimal:":""}localhost
        params:
          - port=7036
    webserver:
      - name: Demo Webserver
        params:
          - port=${option:insecure?8080:8443}
  
  motm:
    _short: "MOTM profile"
    _description: |
      The `motm` profile supports the creation of a Monitor Of The
      Monitors satellite system setup. The profile installs a
      Self-Announcing netprobe which is dynamically configured to report
      the status or all Geneos components on the host to cental MOTM
      gateways.

      To set-up Motitoring-Of-The-Monitoring using this profile, run the
      following command:

      ```bash
      $ geneos deploy profile motm [OPTIONS]
      ```

      The following command options are supported:

        - `--signing-bundle`: The path to the signing bundle file. This
        is required so that locally created certificates share a trust
        chain with other Geneos servers.

        - `--certs-password`: The password for the certificate bundle,
        applicable only to PKCS#12/PFX bundles.

        - `--attribute`: An attribute to be applied to the managed
        entities. Can be repeated s many times as required. Each geneos
        component is also automatically assigned an attribute in the
        form `GATEWAY=GatewayName`.
        
        - `--gateway`: The name and port of the gateway (HOST:PORT) to
        connect to. Can be repeated as many times as required.

      When deployed the profile installs one Self-Announcing Netprobe
      with a configuration built based on other Geneos components
      installed on the server. If the Geneos installation changes, for
      example by adding a new Gateway, then you should rebuild the
      profile to reflect the updated configuration.

      The original options are stored in the profile configuration so
      that they are reused when the profile is rebuilt.
    san:
      name: ${option:minimal?"minimal:":""}${hostname}-MOTM-SAN
      gateways: ${option:gateway}
      attributes:
        - APPLICATION=Geneos
        - CATEGORY=Monitoring
        - COMPONENT=MOTM-SAN
        - ${option:attribute}
      types:
        - Level 1 - Infrastructure
        - Level 3 - Geneos Instances
        - Level 3 - Geneos Diagnostics
      variables:
        - type: string
          name: geneosExecPath
          value: ${execpath}
      managed-entities:
        - for-each: gateway
          name: ${replace:gatewayname:name:/ /_/} Gateway
          attributes:
            - APPLICATION=Geneos
            - CATEGORY=MOTM
            - COMPONENT=Gateway
            - ${option:attribute}
            - GATEWAY=${select:gatewayname:name:Unknown}
          types:
            - Level 2 - Basic Application
            - Level 3 - Geneos Gateway
            - Level 3 - Geneos Gateway Load Monitor
          variables:
            - type: string
              name: instanceName
              value: ${config:name}
            - type: string
              name: instanceType
              value: ${type}
            - type: string
              name: instanceExecPath
              value: ${config:program}
            - type: string
              name: logFilePath
              value: ${config:home}/${config:logfile}
            - type: string
              name: consoleLogFilePath
              value: ${config:home}/${type}.txt
            - type: string
              name: statsFilePath
              value: ${config:home}/stats.xml

        - for-each: netprobe
          name: ${config:name} Netprobe
          attributes:
            - APPLICATION=Geneos
            - CATEGORY=MOTM
            - COMPONENT=Netprobe
            - ${option:attribute}
            - NETPROBE=${config:name}
          types:
            - Level 2 - Basic Application
            - Level 3 - Geneos Netprobe
          variables:
            - type: string
              name: instanceName
              value: ${config:name}
            - type: string
              name: instanceType
              value: ${type}
            - type: string
              name: instanceExecPath
              value: ${config:program}
            - type: string
              name: logFilePath
              value: ${config:home}/${config:logfile}
            - type: string
              name: consoleLogFilePath
              value: ${config:home}/${type}.txt
            - type: string
              name: CALogFilePath
              value: ${config:home}/${config:calogfile}

        - for-each: minimal
          name: ${config:name} Netprobe
          attributes:
            - APPLICATION=Geneos
            - CATEGORY=MOTM
            - COMPONENT=Netprobe
            - ${option:attribute}
            - NETPROBE=${config:name}
          types:
            - Level 2 - Basic Application
            - Level 3 - Geneos Netprobe
          variables:
            - type: string
              name: instanceName
              value: ${config:name}
            - type: string
              name: instanceType
              value: ${type}
            - type: string
              name: instanceExecPath
              value: ${config:program}
            - type: string
              name: logFilePath
              value: ${config:home}/${config:logfile}
            - type: string
              name: consoleLogFilePath
              value: ${config:home}/${type}.txt

        - for-each: licd
          name: ${config:name} Licence Daemon
          attributes:
            - APPLICATION=Geneos
            - CATEGORY=MOTM
            - COMPONENT=Licence Daemon
            - ${option:attribute}
            - LICENCE_DAEMON=${config:name}
          types:
            - Level 2 - Basic Application
            - Level 3 - Geneos Licence Daemon
          variables:
            - type: string
              name: instanceName
              value: ${config:name}
            - type: string
              name: instanceType
              value: ${type}
            - type: string
