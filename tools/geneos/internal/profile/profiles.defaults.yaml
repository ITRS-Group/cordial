  motm-gateway:
    _short: "MOTM gateway profile"
    _description: |
      Configuration for the MOTM gateway, including its parameters,
      includes, and variables. 
    gateways:
      - name: ${hostname}-motm
        includes:
          # Level 0 - Foundation includes for the MOTM gateway
          10000: >
            ITRS Geneos Best Practice |
            Level 0 - Foundation |
            ../../includes/itrs.level0.foundation.xml

          # Level 1 - Infrastructure includes for the MOTM gateway
          11000: >
            ITRS Geneos Best Practice |
            Level 1 - Infrastructure |
            ../../includes/itrs.level1.infrastructure.xml
          00500: >
            ITRS Geneos Best Practice |
            Configuration |
            ../../includes/config/config.level1.infrastructure.xml

          # Level 2 - Basic application includes for the MOTM gateway
          01010: >
            ITRS Geneos Best Practice |
            Level 2 - Basic Application |
            ../../includes/itrs.level2.basic-application.xml
          00510: >
            ITRS Geneos Best Practice |
            Configuration |
            ../../includes/config/config.level2.basic-application.xml

          # Level 3 - Advanced application includes for the MOTM gateway
          01020: >
            ITRS Geneos Best Practice |
            Level 3 - Advanced Application |
            ../../includes/itrs.level3.geneos.xml
          00520: >
            ITRS Geneos Best Practice |
            Configuration |
            ../../includes/config/config.level3.geneos.xml
            
        variables:
          - type: string
            name: logFilePath
            value: ${config:home}/${config:logfile}

    netprobes:
      - name: ${option:minimal?"minimal:":""}${hostname}-MOTM-Probe

