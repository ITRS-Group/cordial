        - for-each: webserver
          name: ${config:name} Webserver
          attributes:
            - APPLICATION=Geneos
            - CATEGORY=MOTM
            - COMPONENT=Web Dashboard Server
            - ${option:attribute}
            - WEB_DASHBOARD_SERVER=${config:name}
          types:
            - Level 2 - Basic Application
            - Level 3 - Geneos Webserver
          variables:
            - type: string
              name: instanceName
              value: ${config:name}
            - type: string
