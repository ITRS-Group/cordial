profiles:
  all:
    gateway:
        - name: ${hostname}
    licd:
        - name: perm
          import:
            - geneos.lic=/tmp/abc.lic
    netprobe:
        - name: ${hostname}
    webserver:
          - name: ${hostname}
  demo:
    gateway:
      - name: Demo Gateway
        profile-managed: false
        params:
          - options=-demo
          - port=7039
    netprobe:
      - name: ${hostname}-demo
        params:
          - port=7036
    webserver:
      - name: ${hostname}-demo
  motm:
    gateways:
      - name: ${hostname}-motm
        profile-managed: true
        env:
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk
        params:
          - licdhost=licd.example.com
            licdsecure=true
        includes:
          - 10: /test/path.xml
            11: /another/test/path.xml
            50: >
              ITRS Geneos Best Practice |
              Level 0 |
              /path/to/level0.xml
            100: >
              ITRS Geneos Best Practice |
              Level 1 - Infrastructure |
              ../../geneos/includes/itrs.level1.infrastructure.xml
            101: >
              ITRS Geneos Best Practice |
              Level 2 - Basic Application |
              ../../includes/itrs.level2.basic-application.xml
        variables:
          - type: string
            name: example_variable
            value: example_value
    netprobes:
        - name: minimal:${hostname}-motm
  motm-endpoint:
    sans:
      - name: minimal:${hostname}-motm
        profile-managed: always
        # cert-bundle: "~/path/to/cert-bundle.pem"
        # cert-bundle-password: "changeit"
        env:
          - JAVA_HOME=/usr/lib/jvm/java-11-openjdk
        gateways:
          - localhost: 7112
        params:
          - options=example
        attributes:
          - CATEGORY=Geneos
          - COMPONENT=MOTM2
          - ATTR=VALUE
        types:
          - Level 0 - Geneos
          - Level 0 - Geneos Extras
          - Level 1 - Infrastructure
        variables:
          - type: string
            name: example_variable
            value: example_value
          - type: string
            name: another_example_variable
            value: another_example_value
        managed-entities:
          - for-each: gateway
            # match: [ "Example*" ]
            # Ignore: [ "Demo*" ]
            name: ${replace:gatewayname:name:/ /_/} Gateway
            attributes:
              - APPLICATION=Geneos
              - CATEGORY=Geneos
              - COMPONENT=Gateway
              - GATEWAY=${config:name}
            types:
              - Level 0 - Load Monitoring
              - Level 2 - Basic Application
              - Level 2 - Geneos Gateway
            variables:
              - type: string
                name: logfile
                value: ${config:home}/${config:logfile}
              - type: string
                name: statsfile
                value: ${config:home}/stats.xml
          - for-each: netprobe
            name: ${config:name} Netprobe
            attributes:
              - APPLICATION=Geneos
              - CATEGORY=Geneos
              - COMPONENT=Netprobe
            types:
              - Level 2 - Basic Application
              - Level 2 - Geneos Netprobe
            variables:
              - type: string
                name: logfile
                value: ${config:home}/${config:logfile}
          - for-each: webserver
            name: ${config:name} Webserver
            attributes:
              - APPLICATION=Geneos
              - CATEGORY=Geneos
              - COMPONENT=Webserver
            types:
              - Level 2 - Basic Application
              - Level 2 - Geneos Webserver
            variables:
              - type: string
                name: logfile
                value: ${config:home}/${config:logfile}
